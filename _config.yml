# GitHub Pages (Jekyll). Os .md sem front matter viram páginas, e os links entre .md viram .html.
title: CicloBem
description: Calendário menstrual simples e privado.
lang: pt-BR
baseurl: /ciclo-site

# O GitHub Pages já liga estes; listados para o build local (`jekyll build`) sair igual.
plugins:
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-relative-links

# Layout próprio com o visual do app (docs/specs/site-visual.md): os .md não mudam. `ref` liga as versões da mesma
# página nos três idiomas (troca de idioma no cabeçalho, chaves de `pages` em _data/i18n.yml).
defaults:
  - scope: { path: "" }
    values: { layout: default, lang: pt-BR }
  - scope: { path: en }
    values: { lang: en }
  - scope: { path: es }
    values: { lang: es }
  - scope: { path: privacidade.md }
    values: { ref: privacy }
  - scope: { path: en/privacy.md }
    values: { ref: privacy }
  - scope: { path: es/privacidad.md }
    values: { ref: privacy }
  - scope: { path: suporte.md }
    values: { ref: help }
  - scope: { path: en/support.md }
    values: { ref: help }
  - scope: { path: es/ayuda.md }
    values: { ref: help }
